name: Production smoke

on:
  workflow_dispatch:
    inputs:
      run_tournament_integration:
        description: Run the disposable production tournament rehearsal
        required: true
        default: false
        type: boolean
  schedule:
    - cron: '17 12 * * *'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run smoke:prod

  tournament-integration:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.run_tournament_integration }}
    needs: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: production-tournament-integration
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run disposable tournament integration rehearsal
        run: node scripts/tournament-integration-smoke.mjs
        env:
          ALLOW_PRODUCTION_SMOKE_WRITES: '1'
          TOURNAMENT_ADMIN_TOKEN: ${{ secrets.ONE_TIME_TOURNAMENT_ADMIN_TOKEN_20260727 }}
          TOURNAMENT_MATCH_RESULT_TOKEN: ${{ secrets.ONE_TIME_TOURNAMENT_RESULT_TOKEN_20260727 }}
